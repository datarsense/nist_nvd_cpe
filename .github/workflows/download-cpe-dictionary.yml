name: Download NVD CPE dictionary

on:
  workflow_dispatch:
    inputs:
      include_deprecated:
        description: Include deprecated CPE entries
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install script dependency
        run: python -m pip install -r requirements.txt

      - name: Download CPE dictionary
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          INCLUDE_DEPRECATED: ${{ inputs.include_deprecated }}
        run: |
          if [[ "$INCLUDE_DEPRECATED" == "true" ]]; then
            python download_cpe_dictionary.py --include-deprecated
          else
            python download_cpe_dictionary.py
          fi

      - name: Zip JSON output
        run: |
          python - <<'PY'
          from zipfile import ZIP_DEFLATED, ZipFile

          with ZipFile("cpe_dictionary.zip", "w", compression=ZIP_DEFLATED) as archive:
              archive.write("cpe_dictionary.json")
          PY

      - name: Upload downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: nvd-cpe-dictionary-${{ github.run_number }}
          path: cpe_dictionary.zip
          if-no-files-found: error
          retention-days: 14